<body>
<main class="kitchen">
  <header class="toolbar">
    <div class="brand"><span aria-hidden="true">✷</span> 玲子的生日厨房</div>
    <div class="utilities">
      <button class="quiet" id="music-toggle" aria-expanded="false" aria-controls="music-panel" type="button">音乐</button>
      <button class="quiet" id="sound" type="button" aria-pressed="false">声音关</button>
      <button class="bag" id="bag" type="button">福袋 <span id="count">0</span></button>
    </div>
  </header>
  <section id="music-panel" hidden aria-label="生日背景音乐">
    <div><strong>Soon You’ll Get Better</strong><span>Taylor Swift · The Chicks</span></div>
    <div id="music-player"></div>
    <label class="audio-file">使用本机的这首歌<input type="file" id="local-track" accept="audio/*"></label>
    <audio id="song" controls loop hidden></audio>
  </section>
  <nav class="steps" aria-label="制作进度">
    <span>备料</span><span>烘烤</span><span>夹心</span><span>装饰</span><span>切蛋糕</span>
  </nav>
  <section id="board" class="board" aria-label="蛋糕工作台">
    <canvas id="scene" width="720" height="570" aria-label="彩绘厨房和可操作的蛋糕"></canvas>
    <div id="station-status" class="station-status" hidden>
      <span id="station-name"></span>
      <div id="gesture-meter" class="gesture-meter" role="progressbar" aria-label="当前动作进度" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    </div>
    <div id="intro" class="intro">
      
      <h1>dear玲子，<br>20岁生日快乐</h1>
      <div id="portrait-studio" hidden>
        <div id="photo-mat"><canvas id="birthday-portrait" width="960" height="782" tabindex="0" aria-label="拖动生日帽调整位置，方向键微调"></canvas></div>
        <div class="hat-tools"><label>帽子大小<input type="range" id="hat-size" min="0.55" max="1.65" step=".025" value="1"></label><label>角度<input type="range" id="hat-angle" min="-40" max="40" value="-12"></label></div>
      </div>
      <p id="album-status" aria-live="polite" hidden></p>
      <button id="start" class="primary" type="button">开始做蛋糕</button>
    </div>
    <button id="ticket" class="ticket" type="button" hidden>本场选片人 · 玲子</button>
    <div id="envelope" class="envelope" hidden>
      <button id="open-letter" type="button">翻开相册</button>
    </div>
  </section>
  <section id="work" class="work" hidden aria-label="当前步骤">
    <div class="instruction">
      <h2 id="step-title"></h2>
      <p id="hint" aria-live="polite"></p>
    </div>
    <div id="choices" class="choices"></div>
    <details id="assist"><summary>用按钮操作</summary><div id="actions" class="actions"></div></details>
  </section>
</main>
<dialog id="memory-book" aria-label="玲子的生日相册">
  <button id="close-book" type="button" aria-label="回到蛋糕">×</button>
  <section id="album-pages"><header><h2>玲子的相册</h2><output id="photo-number"></output></header>
    <div id="photo-rail" tabindex="0" aria-label="生日照片，左右滑动翻页"></div>
    <footer><button id="prev-photo" aria-label="上一张" type="button">←</button><button id="next-photo" type="button" aria-label="下一张">→</button><button id="start-fire" type="button" hidden>看烟花</button></footer>
  </section>
  <section id="night-sky" hidden aria-label="生日烟花"><canvas id="fireworks"></canvas><button id="skip-fire" type="button">读信</button></section>
  <section id="birthday-letter" hidden><div class="letter-stock"><h2>给玲子</h2><div id="typed-letter"></div><span id="accessible-letter" class="sr-only"></span><button id="read-all" type="button">显示全文</button></div></section>
</dialog>
<dialog id="paper-dialog" class="paper">
  
  <h2 id="paper-title"></h2>
  <div id="paper-body"></div>
  <button id="paper-button" class="primary" type="button"></button>
</dialog>

<script>
"use strict";

const kitchenImages = {};
if (typeof Image !== "undefined") {
  for (const [name, url] of Object.entries({room:window.kitchenBackground,...window.kitchenSprites})) {
    if (!url) continue;
    const img = new Image();
    img.onload=()=>{kitchenImages[name]=img;window.dispatchEvent(new Event("kitchen-art"));};
    img.src=url;
  }
}

const cakeColors=new Map();
function paintedCake(color){
  const original=kitchenImages.iced;
  if(!original||!color||color==="#f8eddd")return original;
  if(cakeColors.has(color))return cakeColors.get(color);
  const c=document.createElement("canvas");c.width=original.width;c.height=original.height;
  const g=c.getContext("2d");g.drawImage(original,0,0);
  g.globalCompositeOperation="multiply";g.fillStyle=color;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation="destination-in";g.drawImage(original,0,0);
  cakeColors.set(color,c);return c;
}
function drawKitchen(ctx, state, time) {
  const { step, progress, frosting, fillings, toppings, cut, eggTaps, oven, strokes, candleX } = state;
  const effect=state.effect,t=effect?.amount??0;
  const demos={sugar:{kind:"sugar",x:387,y:290,pouring:true},sift:{kind:"sift",x:375+46*Math.sin(t*19),y:265,shook:time},fold:{kind:"spatula",x:280+160*t,y:321+55*Math.sin(t*Math.PI)}};
  const hand=state.hand??demos[effect?.kind];
  const wave = Math.sin(time / 950);
  function fill(color, shape) {
    ctx.beginPath();
    shape();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color, rotation = 0) {
    fill(color, () => ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2));
  }
  function rect(x,y,w,h,r,color) {
    fill(color, () => ctx.roundRect(x,y,w,h,r));
  }
  function poly(color, ...points) {
    fill(color, () => { ctx.moveTo(...points[0]); points.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); });
  }
  function curve(color, width, shape) {
    ctx.beginPath(); shape(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.stroke();
  }
  function sprite(name,x,y,width,angle=0,anchorX=.5,anchorY=.5) {
    const image=kitchenImages[name];
    if(!image)return false;
    const height=width*image.naturalHeight/image.naturalWidth;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    ctx.drawImage(image,-width*anchorX,-height*anchorY,width,height);
    ctx.restore();return true;
  }
  function gradient(x1,y1,x2,y2,colors){
    const light=ctx.createLinearGradient(x1,y1,x2,y2);
    colors.forEach((color,i)=>light.addColorStop(i/(colors.length-1),color));return light;
  }
  function guide(points,alpha=.85) {
    ctx.save();ctx.globalAlpha=alpha;ctx.setLineDash([5,8]);
    curve("#3c5269",3,()=>points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)));
    ctx.setLineDash([]);const [x,y]=points.at(-1);ellipse(x,y,4,4,"#fff6da");ctx.restore();
  }
  function ring(x,y,rx,ry){
    ctx.save();ctx.setLineDash([5,7]);curve("#fcf6df",2.5,()=>ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2));ctx.restore();
  }
  function tin(x,y,scale,level) {
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    ellipse(3,20,145,39,"#263b523a");
    fill(gradient(-142,0,142,42,["#51667b","#b9c7cd","#708799","#47586c"]),()=>{ctx.moveTo(-141,-7);ctx.lineTo(-138,17);ctx.bezierCurveTo(-105,64,107,61,138,17);ctx.lineTo(141,-7);ctx.closePath();});
    ellipse(0,-7,141,42,"#d7dcd9");ellipse(0,-8,133,36,"#617385");
    if(level>0)ellipse(0,-6,25+106*level,6+27*level,gradient(-121,-38,115,27,["#e2bc88","#ffebbe","#d8ad75"]));
    ctx.restore();
  }
  function stick(x,y,match) {
    ctx.save();ctx.translate(x,y);ctx.rotate(match?.65:0);
    if(match){rect(-3,-1,6,65,2,"#c29468");ellipse(0,0,5,7,"#87484c");
      fill("#e9a453",()=>{ctx.moveTo(0,0);ctx.quadraticCurveTo(-12,-6,0,-22);ctx.quadraticCurveTo(10,-8,0,0);});}
    else {rect(-7,-65,14,65,4,"#fff0d9");for(let i=0;i<4;i++)poly("#bb8298",[-7,-59+14*i],[7,-54+14*i],[7,-48+14*i],[-7,-54+14*i]);
      curve("#524957",2,()=>{ctx.moveTo(0,-64);ctx.lineTo(1,-73);});}
    ctx.restore();
  }
  function ingredient(name, x, y, scale = 1) {
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    const portrait={"蓝莓":"berries","芒果":"mango","蜜桃":"peach","糖霜":"cream"}[name];
    if(portrait&&sprite(portrait,0,0,name==="糖霜"?27:37)){ctx.restore();return;}
    if (name === "草莓") {
      if(sprite("strawberry",0,0,40)) {ctx.restore();return;}
      fill("#ba3d60",()=>{ctx.moveTo(0,15);ctx.bezierCurveTo(-28,-4,-20,-22,0,-13);ctx.bezierCurveTo(20,-22,28,-4,0,15);});
      poly("#657e65",[-12,-15],[-3,-17],[0,-24],[5,-17],[13,-15],[0,-11]);
      for (const [a,b] of [[-9,-6],[1,-7],[9,-3],[-4,1],[4,5]]) ellipse(a,b,1.4,2,"#f6d7ab",-.35);
    } else if (name === "蓝莓") {
      ellipse(-7,4,11,10,"#52679a");ellipse(7,-2,11,10,"#6b7fb0");ellipse(4,-5,4,2,"#a0acd1");
    } else if (name === "芒果" || name === "蜜桃") {
      poly(name==="芒果"?"#f0ae52":"#eca087",[-15,-5],[-2,-14],[15,-7],[13,8],[-3,15],[-15,6]);
      poly("#ffd197",[-15,-5],[-2,-14],[15,-7],[0,1]);
    } else if (name === "巧克力碎") {
      poly("#57373f",[-18,8],[-13,-11],[1,-6],[8,8],[-1,15]);
      poly("#81524d",[4,-4],[14,-12],[20,2],[12,9]);
    } else if (name === "生日牌") {
      rect(-44,-12,88,24,5,"#583c48");ctx.fillStyle="#fff0df";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText("玲子生日快乐",0,4);
    } else if (name === "糖霜") {
      ellipse(0,3,14,7,"#d58ca8");ellipse(0,0,11,7,"#fff1e8");ellipse(1,-5,6,5,"#fff9ef");
    } else {
      const c={"奶糯米":"#fff3e3","开心果奶芙":"#a8bc86","脆饼碎":"#d19656","爆米花":"#f3d49a"}[name] || "#f3d49a";
      ellipse(-7,3,10,9,c);ellipse(7,4,11,8,c);ellipse(1,-4,11,9,c);ellipse(0,-6,5,3,"#fff6d6");
    }
    ctx.restore();
  }
  function egg(x,y,cracks = 0) {
    ellipse(x+4,y+27,39,10,"#6c819b39");
    if(!sprite("egg",x,y,89,cracks?.07:-.2)){
      fill("#fbecda",()=>{ctx.moveTo(x,y-44);ctx.bezierCurveTo(x-24,y-44,x-43,y+20,x-18,y+32);ctx.bezierCurveTo(x+22,y+52,x+48,y+18,x+27,y-17);ctx.quadraticCurveTo(x+15,y-44,x,y-44);});
      ellipse(x-9,y-11,12,22,"#fff7e9",.35);
    }
    if(cracks) curve("#a47868",2,()=>{ctx.moveTo(x-29,y+1);ctx.lineTo(x-15,y-5);ctx.lineTo(x-5,y+5);ctx.lineTo(x+9,y-4);ctx.lineTo(x+18,y+5);ctx.lineTo(x+30,y-1);});
  }
  function bowl(x,y,amount) {
    ellipse(x+6,y+114,155,25,"#26395731");
    fill(gradient(x-156,y,x+145,y+105,["#607c94","#cadae4","#829cb7","#3d526d"]),()=>{ctx.moveTo(x-156,y);ctx.quadraticCurveTo(x-132,y+126,x,y+128);ctx.quadraticCurveTo(x+127,y+125,x+156,y);ctx.closePath();});
    ellipse(x,y,156,54,"#e7e6df");
    ellipse(x,y-2,144,47,gradient(x,y-35,x,y+40,["#476783","#9ab5c8","#6887a5"]));
    if(amount>=0) {
      const batterLight=amount>.65?["#ecd7a8","#fff3cf","#e3c48f"]:["#d48447","#f9cb76","#e2a456"];
      ellipse(x,y+17,115+amount*20,24+amount*9,gradient(x-70,y-5,x+110,y+35,batterLight));
      if(amount<.25){

      for(const width of [10,19,29]) curve("#e6edf5",3,()=>ctx.ellipse(0,31,width,42,0,0,Math.PI*2));
      ctx.restore();
      }
    }
    if(step==="sift") {
      const x=hand?.kind==="sift"?hand.x:374,y=hand?.kind==="sift"?hand.y-40:264;
      sprite("sieve",x+20,y,171,0,.5,.51);
      if(progress>0)ellipse(348,350,14+65*progress,3+9*progress,"#f9ebd0");
      if(hand&&time-(hand.shook??-1000)<450)for(let i=0;i<130;i++){const u=(time/610+i*.618)%1;ellipse(x-48+(i*17)%81+Math.sin(i)*u*12,y+10+(342-y)*u*u,1.65,1.15,"#fff7e3ce");}
    }
  }
}

const key=location.hash.startsWith("#album=")?"lingzi-birthday-photos-v4":"lingzi-kitchen-v1"+(new URLSearchParams(location.search).get("play")==="kitchen3"?"-studio3":"");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const canvas = $("scene");

const paper = $("paper-dialog");
const fresh = () => ({step:"intro", progress:0, eggTaps:0, collected:[], pending:null, selected:[], fillings:[], toppings:[], frosting:palette["香草白"], strokes:[], cut:[], candleX:360, placed:false, sound:false, fruitPrep:0, prepared:[], spread:[], fillingSites:{}, popped:[], mist:[], gripped:false});
let data = fresh();
try {
  const saved=JSON.parse(localStorage.getItem(key));

} catch {}
let frame=0, stageTime=performance.now(), drawRequested=false, breath=0, micStop=null, audio=null, tool="草莓", active=null, pressTimer=null, choiceNotice="", modalAction=null, effect=null;
const gestures=new Set(["sugar","mix","sift","fold","pan","tap","cream","frost"]);
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const tray=()=>[...data.selected,...extras];
function updateMeter(){
  const meter=$("gesture-meter");

function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch{}}
function tone(freq=480) {
  if(!data.sound) return;
  try {
    const Audio=window.AudioContext||window.webkitAudioContext;
    audio ??= new Audio();
    void audio.resume();
    const surfaces={egg:[.08,1500],sift:[.16,2300],fold:[.18,720],cream:[.15,780],frost:[.14,670],fruit:[.075,1650],cutLayer:[.11,900],cut:[.12,830],filling:[.075,510],tap:[.08,520]};
    const surface=surfaces[data.step];
    if(surface){
      const [seconds,hz]=surface;
      const buffer=audio.createBuffer(1,Math.round(audio.sampleRate*seconds),audio.sampleRate),samples=buffer.getChannelData(0);
      for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/samples.length,2);
      const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),level=audio.createGain();

    gain.gain.setValueAtTime(.07,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.19);

    oscillator.start(); oscillator.stop(audio.currentTime+.2);
  } catch {}
}
function render(now) {
  drawRequested=false;
  const oven=["ovenIn","fruit","bake","ovenOut"].includes(data.step);
  if(active) tickPour(now);
  if(pressTimer) breath=clamp((now-blowStarted)/1000,0,1);
  const progress=data.progress;
  if(effect)effect.amount=clamp((now-effect.start)/effect.duration,0,1);

  if(!document.hidden && (active||pressTimer||!reduce.matches&&(effect||data.step==="blow"))) redraw();

function redraw(){if(!drawRequested){drawRequested=true;frame=requestAnimationFrame(render);}}
function move(step) {

  const c=$("choices"), a=$("actions");

  if(step==="fold") main("翻拌一下",()=>gestureDemo("fold",.34,"pan"));
  if(step==="pan") main("倒入模具",()=>move("tap"));
  if(step==="tap") main("轻敲模具",()=>{
    const i=[0,1].find(n=>!data.popped.includes(n));if(i!==undefined)data.popped.push(i);

    for(const item of fruit) button(c,item,()=>{
      if(data.selected.includes(item)){data.fruitPrep=0;data.selected=data.selected.filter(x=>x!==item);data.prepared=data.prepared.filter(x=>x!==item);}

    },{pressed:data.selected.includes(item)});
    const prep=data.selected.find(item=>!data.prepared.includes(item));

  }
  if(step==="bake") main("擦开玻璃",()=>{
    for(let i=0;i<7;i++)data.mist.push([261+(i%4)*53,239+Math.floor(i/4)*43+data.progress*45]);
    progressAction(.5,null,"bake","ovenOut");
  });
  if(step==="ovenOut") main("戴手套取出",()=>{tone(690);move("unmold");});
  if(step==="cutLayer") main("脱模并切层",()=>move("cream"));

    for(const item of ["草莓","蓝莓","巧克力碎","爆米花","糖霜","生日牌"]) button(c,item,()=>{tool=item;refresh();},{pressed:tool===item});
    main("装饰好了",()=>move("insert"));
    alt("放上"+tool,()=>addTopping(360+Math.cos(data.toppings.length*1.9)*74,326+Math.sin(data.toppings.length*1.9)*30));
    if(data.toppings.length||data.strokes.length) alt("撤销",()=>{
      const last=data.history?.pop(); if(last==="line" || (!last && data.strokes.length))data.strokes.pop();else data.toppings.pop();save();refresh();
    });
  }
  if(step==="insert") main("插上蜡烛",()=>placeCandle(360));
  if(step==="light") main("点蜡烛",()=>{tone(490);move("blow");});

function progressAction(amount,next,wishKey,wishNext) {
  data.progress=Math.min(1,data.progress+amount);tone(330+data.progress*140);
  if(data.progress>=1){if(wishKey) bless(wishKey,wishNext);else move(next);}

  $("paper-button").textContent=label;modalAction=action;

  paper.classList.toggle("wish-mode",kind==="wish");

});

$("start").addEventListener("click",()=>move("egg"));

function startBlow(){

async function listenForBlow(){

  const micButton=[...$("actions").children].find(el=>el.textContent==="用麦克风吹");

portrait.addEventListener("pointerdown",e=>{
  const [x,y]=pointerSpot(e),h=hat();
  if(Math.hypot((x-h.x)/(.112*h.scale),(y-h.y+.073*h.scale)/(.15*h.scale))>1.35)return;
  hatDrag={id:e.pointerId,x:x-h.x,y:y-h.y};portrait.setPointerCapture(e.pointerId);
});
portrait.addEventListener("pointermove",e=>{
  if(hatDrag?.id!==e.pointerId)return;
  const [x,y]=pointerSpot(e);hat().x=clamp(x-hatDrag.x,.06,.94);hat().y=clamp(y-hatDrag.y,.12,.96);paintPortrait();
});
function finishHat(){if(hatDrag){hatDrag=null;save();}}
portrait.addEventListener("pointerup",finishHat);portrait.addEventListener("pointercancel",finishHat);
portrait.addEventListener("keydown",e=>{
  const delta={ArrowLeft:[-.006,0],ArrowRight:[.006,0],ArrowUp:[0,-.006],ArrowDown:[0,.006]}[e.key];
  if(delta){e.preventDefault();hat().x=clamp(hat().x+delta[0],.06,.94);hat().y=clamp(hat().y+delta[1],.12,.96);paintPortrait();save();}
});
for(const [id,field] of [["hat-size","scale"],["hat-angle","angle"]]){
  $(id).addEventListener("input",e=>{hat()[field]=Number(e.target.value);paintPortrait();save();});
}
function scheduleAlbum(){clearTimeout(startBookTimer);startBookTimer=setTimeout(()=>{if(data.step==="done"&&!paper.open&&!book.open)startAlbum();},1600);}
async function startAlbum(preview=false){
  clearTimeout(startBookTimer);if(book.open)return;
  await loadAlbum;if(book.open||paper.open||(!preview&&data.step!=="done"))return;
  book.showModal();bookPhase="gallery";
  $("album-pages").hidden=false;$("night-sky").hidden=true;$("birthday-letter").hidden=true;
  if(!photoURLs.length){showFireworks();return;}
  paintPortrait();rail.replaceChildren();
  photoURLs.forEach((url,i)=>{
    const frame=document.createElement("figure"),img=new Image();
    img.src=i===7&&coverPhoto?portrait.toDataURL("image/jpeg",.86):url;img.alt="生日相册第 "+(i+1)+" 张";
    frame.append(img);const text=window.birthdayCaptions?.[i];if(text){const caption=document.createElement("figcaption");caption.textContent=text;frame.append(caption);}rail.append(frame);
  });
  slide=0;rail.scrollLeft=0;showSlide(0,false);
}
function updateSlide(){
  if(bookPhase!=="gallery"||!rail.firstElementChild)return;
  const center=rail.getBoundingClientRect().left+rail.clientWidth/2;
  const distances=[...rail.children].map(node=>{const r=node.getBoundingClientRect();return Math.abs(r.left+r.width/2-center);});
  const next=distances.indexOf(Math.min(...distances));slide=next;
  $("photo-number").textContent=String(slide+1).padStart(2,"0")+" / "+String(photoURLs.length).padStart(2,"0");
  $("prev-photo").disabled=slide===0;
  $("next-photo").hidden=slide===photoURLs.length-1;$("start-fire").hidden=!$("next-photo").hidden;
  rail.querySelectorAll("figure").forEach((node,i)=>node.classList.toggle("current",i===slide));
}
function showSlide(n,smooth=true){
  const el=rail.children[clamp(n,0,photoURLs.length-1)];if(!el)return;
  const box=el.getBoundingClientRect(),r=rail.getBoundingClientRect();
  rail.scrollTo({left:rail.scrollLeft+box.left+box.width/2-r.left-r.width/2,behavior:smooth&&!reduce.matches?"smooth":"instant"});
  updateSlide();
}
function settleSlide(){
  clearTimeout(lastSlideTimer);updateSlide();
  if(bookPhase==="gallery"&&slide===photoURLs.length-1&&!rail.classList.contains("dragging")){
    lastSlideTimer=setTimeout(()=>{if(book.open&&bookPhase==="gallery"&&slide===photoURLs.length-1)showFireworks();},5000);
  }
}
let settleTimer=0,railDrag=null;
rail.addEventListener("scroll",()=>{clearTimeout(lastSlideTimer);updateSlide();clearTimeout(settleTimer);settleTimer=setTimeout(settleSlide,180);},{passive:true});
rail.addEventListener("pointerdown",e=>{
  clearTimeout(lastSlideTimer);
  if(e.pointerType!=="mouse")return;
  railDrag={x:e.clientX,left:rail.scrollLeft};rail.classList.add("dragging");rail.setPointerCapture(e.pointerId);
});
rail.addEventListener("pointermove",e=>{if(railDrag)rail.scrollLeft=railDrag.left+railDrag.x-e.clientX;});
function finishRail(){if(railDrag){railDrag=null;rail.classList.remove("dragging");updateSlide();showSlide(slide);}settleSlide();}
rail.addEventListener("pointerup",finishRail);rail.addEventListener("pointercancel",finishRail);
rail.addEventListener("keydown",e=>{const dir={ArrowLeft:-1,ArrowRight:1}[e.key];if(dir){e.preventDefault();showSlide(slide+dir);}});
$("prev-photo").onclick=()=>showSlide(slide-1);$("next-photo").onclick=()=>showSlide(slide+1);
$("start-fire").onclick=showFireworks;
function showFireworks(){
  if(!book.open||bookPhase!=="gallery")return;
  clearTimeout(lastSlideTimer);bookPhase="fire";
  $("album-pages").hidden=true;$("night-sky").hidden=false;
  const sky=$("fireworks"),c=sky.getContext("2d"),box=sky.getBoundingClientRect();
  const w=box.width,h=box.height,dpr=Math.min(2,devicePixelRatio);
  sky.width=w*dpr;sky.height=h*dpr;c.setTransform(dpr,0,0,dpr,0,0);
  const stars=Array.from({length:55},(_,i)=>[w*((i*71%113)/113),h*((i*43%97)/120),i%4===0?1.4:.65]);
  const volleys=[[.17,.33,.39,"247,194,146"],[.85,.70,.32,"223,163,178"],[1.65,.49,.22,"241,219,171"],[2.3,.22,.46,"151,193,220"],[2.65,.75,.40,"247,202,163"]];
  for(let j=0;j<24;j++)volleys.push([3+j*.16,.10+(j*37%83)/100,.13+(j*19%43)/100,["238,184,133","204,168,217","159,205,223","255,221,163"][j%4]]);
  const start=performance.now();
  function draw(now){
    if(bookPhase!=="fire")return;
    const t=(now-start)/1000;
    c.fillStyle="#142138";c.fillRect(0,0,w,h);
    for(const [x,y,r] of stars){c.fillStyle="#cdd6df99";c.beginPath();c.arc(x,y,r,0,7);c.fill();}
    if(!reduce.matches){
      for(const [delay,x,y,color] of volleys){
        const a=t-delay;if(a<0||a>2.25)continue;
        if(a<.52){const k=a/.52,py=h*(.96-(.96-y)*k);
          c.strokeStyle="rgba("+color+",.82)";c.lineWidth=1.7;c.beginPath();c.moveTo(w*x,py+14);c.lineTo(w*x,py);c.stroke();continue;}
        const age=a-.52,R=Math.min(w*.24,h*.20);
        for(let i=0;i<60;i++){
          const angle=i*2.39996,len=R*(.46+(i*23%59)/79);
          const point=v=>[w*x+Math.cos(angle)*len*(1-Math.exp(-v*3.0)),h*y+Math.sin(angle)*len*(1-Math.exp(-v*3.0))+v*v*21];
          const p=point(age),q=point(Math.max(0,age-.054));
          c.strokeStyle="rgba("+color+","+Math.max(0,1-age/1.71)+")";c.lineWidth=i%3?1.35:2.1;c.beginPath();c.moveTo(...q);c.lineTo(...p);c.stroke();
        }
      }
    }
    if(t>(reduce.matches?.05:7.1))finaleLetters(c,w,h,reduce.matches?1:t-7.1,partyLooks[partyIndex()][2]);
    if(t>(reduce.matches?3.8:12.4))typeLetter();else fireFrame=requestAnimationFrame(draw);
  }
  fireFrame=requestAnimationFrame(draw);
}
function typeLetter(){
  if(bookPhase!=="fire")return;
  cancelAnimationFrame(fireFrame);bookPhase="letter";$("night-sky").hidden=true;$("birthday-letter").hidden=false;
  currentLetter="亲爱的玲子，生日快乐！"+(window.birthdayLetter?.trim()?"\n\n"+window.birthdayLetter.trim():"");
  $("accessible-letter").textContent=currentLetter;$("typed-letter").setAttribute("aria-hidden","true");$("typed-letter").textContent="";$("read-all").hidden=false;
  const chars=Array.from(currentLetter);let pos=0;
  function next(){
    if(bookPhase!=="letter")return;
    const ch=chars[pos++];$("typed-letter").textContent+=ch;
    if(pos<chars.length)letterTimer=setTimeout(next,/[。！？\n]/.test(ch)?250:58);else $("read-all").hidden=true;
  }
  if(reduce.matches)finishLetter();else next();
}
function finishLetter(){clearTimeout(letterTimer);$("typed-letter").textContent=currentLetter;$("read-all").hidden=true;}
$("skip-fire").onclick=typeLetter;$("read-all").onclick=finishLetter;
$("close-book").onclick=()=>book.close();
book.addEventListener("close",()=>{bookPhase="";clearTimeout(lastSlideTimer);clearTimeout(settleTimer);clearTimeout(letterTimer);cancelAnimationFrame(fireFrame);});
$("music-toggle").onclick=()=>{
  const panel=$("music-panel");panel.hidden=!panel.hidden;$("music-toggle").setAttribute("aria-expanded",String(!panel.hidden));
  if(panel.hidden||$("music-player").firstElementChild||trackURL)return;
  const player=document.createElement("iframe");player.title="Apple Music · Soon You’ll Get Better";player.referrerPolicy="no-referrer";player.allow="autoplay; encrypted-media";
  player.src="https://embed.music.apple.com/us/song/1468058699?theme=dark";$("music-player").append(player);
};
$("local-track").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $("music-player").replaceChildren();const el=$("song");if(trackURL)URL.revokeObjectURL(trackURL);
  trackURL=URL.createObjectURL(f);el.src=trackURL;el.hidden=false;await el.play().catch(()=>{});
};
if(photoKey||window.offlinePhotos){
  $("album-status").hidden=false;$("album-status").textContent="正在打开生日照片…";$("start").disabled=true;
}
loadAlbum=openAlbumFiles().catch(()=>{
  photoURLs.splice(0).forEach(url=>URL.revokeObjectURL(url));
  $("album-status").hidden=false;$("album-status").textContent="照片未能打开。请使用包含 #album= 的完整生日链接重新打开。";
}).finally(()=>{$("start").disabled=false;});


mountLooks();
