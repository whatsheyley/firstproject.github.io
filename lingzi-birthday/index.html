:root{color-scheme:light;--ink:#39211f;--red:#ac322c;--cream:#fff5df;--muted:#714734;--line:#e2bd98;--paper:#fff9e9;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f6dec2;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#fff4d8,#f0c6a5 90%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #643d92;outline-offset:4px}button[disabled]{cursor:wait;opacity:.6}[hidden]{display:none!important}
.kitchen{width:min(100% - 36px,800px);margin:auto;padding:20px 0 24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.brand{font-size:1rem;font-weight:820;letter-spacing:.06em}.brand span{color:var(--red);margin-right:4px}.utilities{display:flex;gap:6px}.quiet,.bag{min-height:42px;border:1px solid #bc8e71;border-radius:8px;background:#fff3db;color:var(--ink);padding:6px 10px;font-size:.88rem;white-space:nowrap}.bag{background:#a62f30;color:#fff6e3;border-color:#872529}.bag span{display:inline-grid;place-items:center;min-width:1.3em;background:#ffe3ad;color:#752321;border-radius:50%;margin-left:4px;font-weight:800}.bag.pop{animation:bag-pop .5s ease}
.steps{display:flex;justify-content:space-between;gap:4px;font-size:.85rem;font-weight:650;margin:0 0 9px;color:#755340}.steps span{flex:1;text-align:center;padding:5px 1px;border-bottom:2px solid #d5aa8b}.steps .active{color:#8f2924;border-color:#ac322c}.steps .done{border-color:#a2634a}
.board{position:relative;background:#e7aa74;border:2px solid #754738;border-radius:16px;overflow:hidden;box-shadow:0 8px 0 #b88566,0 20px 36px #8f4e2a32;isolation:isolate}.board canvas{display:block;width:100%;max-height:60svh;aspect-ratio:720/570;object-fit:fill;touch-action:none;user-select:none}.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6%;pointer-events:none;background:linear-gradient(90deg,#fff4dbd9,#fff0d24d 46%,transparent 67%)}.intro h1{font-family:"KaiTi","STKaiti","Songti SC",serif;font-size:clamp(2.8rem,8.1vw,5.6rem);line-height:.99;letter-spacing:-.095em;margin:.12em 0 .36em;color:#832b24;text-shadow:2px 2px #fff1d4}.intro-star{font-size:clamp(1.15rem,4vw,2rem);color:#9c4025}.intro button{pointer-events:auto}.primary,.secondary,.choice{min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid #89332b;color:#fff9e9;background:var(--red);font-weight:750;box-shadow:0 2px 0 #742620}.secondary,.choice{background:#fff3dc;color:var(--ink);border-color:#c29170;box-shadow:none}.choice[aria-pressed=true]{background:#f3c4a9;border-color:#8f332b}.primary:active,.secondary:active,.choice:active{transform:translateY(1px)}
.work{margin-top:19px}.instruction h2{margin:0;font-size:1.35rem;line-height:1.25}.instruction p{margin:5px 0 10px;color:var(--muted);line-height:1.45;font-size:.96rem;min-height:1.4em}.choices,.actions{display:flex;gap:7px;flex-wrap:wrap}.choices:empty,.actions:empty{display:none}.choices:not(:empty)+.actions:not(:empty){margin-top:9px}.choice{padding:7px 11px;font-size:.9rem}.ticket{position:absolute;top:3%;right:3%;padding:7px 13px;background:#ffe5aa;color:#6d3925;border:1px dashed #91563c;border-radius:4px;font-size:.84rem}.envelope{position:absolute;right:6%;bottom:11%;transform:rotate(7deg)}.envelope button{border:2px solid #ad5a46;border-radius:8px;color:#7c3027;background:linear-gradient(155deg,#f9ddad 48%,#edc18b 49%,#fff1ce 53%);min-width:105px;padding:13px 12px;box-shadow:4px 6px 0 #73452f52;font-weight:800}.envelope span{display:block;color:var(--red)}
.paper{width:min(90vw,430px);max-height:80svh;overflow:auto;border:1px solid #b47a53;border-radius:15px;padding:22px 25px 24px;text-align:center;color:var(--ink);background:var(--paper);box-shadow:0 18px 80px #592b2d57}.paper::backdrop{background:#41231975}.paper h2{margin:3px 0 12px;font-size:1.06rem;color:#70452c}.paper-mark{color:var(--red);font-size:1.5rem}.paper p{margin:0 0 16px;line-height:1.6;white-space:pre-wrap}.paper .wish{font-family:"KaiTi","STKaiti","Songti SC",serif;font-weight:bold;font-size:clamp(1.55rem,5.5vw,2.1rem)}.paper ul{text-align:left;padding-left:20px;line-height:1.65}.paper li{margin:10px 0}.paper small{display:block;color:#754a38}.paper.folding{animation:fold .33s both}.paper .letter{text-align:left;font-size:1.05rem}
@keyframes fold{to{opacity:0;scale:.45;translate:80px -100px;rotate:15deg}}@keyframes bag-pop{45%{transform:rotate(8deg) scale(1.12)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

body{background:radial-gradient(ellipse at 54% 8%,#f5f8fa,#dce7f1 78%)}
.toolbar{margin-bottom:16px}.brand{font-family:"Songti SC","SimSun",serif;font-weight:700}
.quiet,.secondary,.choice{background:#f5f8fc;border-color:#aabed1;color:var(--ink)}
.bag,.primary{background:#a93654;border-color:#8b2e48;box-shadow:0 2px 0 #712039}
.bag span{background:#fff1f1;color:#79243e}.choice[aria-pressed=true]{background:#f7dfe7;border-color:#ad4863}
.steps{color:#506176}.steps span{border-color:#bfcfdd}.steps .active{color:#9a2c4c;border-color:#a93654}.steps .done{border-color:#667e96}
.board{border:1px solid #a3b6cb;background:#a4b8cd;box-shadow:0 10px 26px #2e496629;border-radius:9px}
.intro{overflow:hidden;background:linear-gradient(117deg,#202a49 0 34%,#304569 58%,#30456900 76%);padding:7%}
.intro::before{content:"";position:absolute;inset:0;background:#a93654;clip-path:polygon(0 0,44% 0,0 26%);opacity:.9;animation:curtain .9s ease-out both}
.intro h1,.intro button,.intro-star{z-index:1}.intro h1{color:#fff9ee;text-shadow:none;letter-spacing:-.035em;font:700 clamp(2.3rem,7vw,4.55rem)/1.13 "Songti SC","SimSun",serif;animation:arrive .65s .17s both}
.intro-star{color:#f3b974}.paper{border-color:#aabed1;box-shadow:0 18px 65px #152c5652}.paper::backdrop{background:#1d2e49b5}.paper h2,.paper small{color:#52677e}.paper[open]{animation:arrive .34s both}.paper.folding{animation:fold .34s both}.paper .wish{font-family:"Songti SC","SimSun",serif}
.envelope button{border-color:#ae526b;color:#8b2949;background:linear-gradient(155deg,#f1dce4 48%,#d6a7b9 49%,#faf2eb 53%);box-shadow:4px 6px 0 #344c6952}
.board.candle canvas{cursor:crosshair}.ticket{background:#fff1c8;color:#634625}.hint-note{font-size:.84rem;color:#506176}
.board.transition::after{content:"";pointer-events:none;position:absolute;inset:-1px;background:#334a70;animation:sweep .55s both}
.primary.hold{touch-action:none}.board canvas{max-height:none}.envelope{animation:arrive .55s both}
@keyframes curtain{from{transform:translateX(-45%);opacity:0}to{transform:none;opacity:.9}}
@keyframes arrive{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes sweep{from{clip-path:polygon(0 0,0 0,0 100%,0 100%);opacity:.95}36%{clip-path:polygon(0 0,38% 0,25% 100%,0 100%);opacity:.85}to{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%);opacity:0}}

body{background:linear-gradient(165deg,#1a2538,#242f43 54%,#26364a);color:#f7f2e9}
.kitchen{width:min(100% - 34px,900px);padding-top:18px}
.toolbar{margin-bottom:9px}.brand{color:#f7eadd;letter-spacing:.09em}.brand span{color:#ebaa91}
.utilities .quiet,.utilities .bag{border-color:#64728a;color:#fbf2e9;background:#32425a;box-shadow:none}
.utilities .bag{background:#904358;border-color:#b97684}.bag span{background:#f5d4d6}
.steps{margin-bottom:11px;color:#c1cddd}.steps span{border-color:#465670}.steps .active{color:#f8e8df;border-color:#e2a393}.steps .done{border-color:#91a8bf}
.board{border-color:#75859e;box-shadow:0 15px 45px #07101e80;background:#667a93;border-radius:8px}
.board canvas{max-height:65svh}.board.game canvas{cursor:grab}.board.game canvas:active{cursor:grabbing}
.intro{background:linear-gradient(108deg,#172337e8 3%,#263a55a1 40%,transparent 72%);padding:8%}
.intro::before{background:#be7582;clip-path:polygon(0 0,29% 0,0 15%);opacity:.5}
.intro h1{font-weight:650;line-height:1.18}.intro-star{color:#e9bf8d}
.instruction p,.hint-note{color:#ccd7e4}.work{margin-top:17px;margin-bottom:5px}
.choice,.secondary{background:#29384d;border-color:#657691;color:#f8f2e9}.choice[aria-pressed=true]{background:#ebd2d3;color:#402937;border-color:#ebd2d3}
.primary{background:#a65368;border-color:#c48793;box-shadow:none}.work .primary:has(+.secondary){margin-right:2px}
.station-status{position:absolute;top:13px;left:13px;pointer-events:none;padding:8px 10px;color:#eaf0f4;background:#192a42e8;border:1px solid #758ba796;border-radius:5px;font-size:.84rem;min-width:90px}
.gesture-meter{height:3px;background:#a6b9d06e;margin-top:6px;overflow:hidden}.gesture-meter span{display:block;height:100%;width:100%;background:#f6c49f;transform:scaleX(0);transform-origin:left}
.gesture-meter[hidden]{display:none}
.wish-travel{position:fixed;z-index:5;pointer-events:none;background:#fff4dc;border:1px solid #d5a99b;border-radius:2px;box-shadow:0 2px 10px #291f3d65;width:56px;height:37px;display:grid;place-items:center;color:#91495b}
.paper .wish{line-height:1.42}.paper.wish-paper{width:min(85vw,340px)}
@media(max-width:520px){.kitchen{width:calc(100% - 18px);padding-top:10px}.board canvas{max-height:none}.intro h1{font-size:clamp(2rem,8.3vw,3rem)}.station-status{top:7px;left:7px;padding:6px 8px}.work{margin-top:14px}}

</style>

<body>
<main class="kitchen">
  <header class="toolbar">
    <div class="brand"><span aria-hidden="true">✷</span> 玲子的生日厨房</div>
    <div class="utilities">
      <button class="quiet" id="sound" type="button" aria-pressed="false">声音关</button>
      <button class="bag" id="bag" type="button">福袋 <span id="count">0</span></button>
    </div>
  </header>
  <nav class="steps" aria-label="制作进度">
    <span>备料</span><span>烘烤</span><span>夹心</span><span>装饰</span><span>切蛋糕</span>
  </nav>
  <section id="board" class="board" aria-label="蛋糕工作台">
    <canvas id="scene" width="720" height="570" aria-label="彩绘厨房和可操作的蛋糕"></canvas>
    <div id="station-status" class="station-status" hidden>
      <span id="station-name"></span>
      <div id="gesture-meter" class="gesture-meter" role="progressbar" aria-label="当前动作进度" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    </div>
    <div id="intro" class="intro">
      <span class="intro-star" aria-hidden="true">✦</span>
      <h1>dear玲子，<br>20岁生日快乐</h1>
      <button id="start" class="primary" type="button">开始做蛋糕</button>
    </div>
    <button id="ticket" class="ticket" type="button" hidden>本场选片人 · 玲子</button>
    <div id="envelope" class="envelope" hidden>
      <button id="open-letter" type="button"><span>✦</span>给玲子</button>
    </div>
  </section>
  <section id="work" class="work" hidden aria-label="当前步骤">
    <div class="instruction">
      <h2 id="step-title"></h2>
      <p id="hint" aria-live="polite"></p>
    </div>
    <div id="choices" class="choices"></div>
    <div id="actions" class="actions"></div>
  </section>
</main>
<dialog id="paper-dialog" class="paper">
  <div class="paper-mark" aria-hidden="true">✦</div>
  <h2 id="paper-title"></h2>
  <div id="paper-body"></div>
  <button id="paper-button" class="primary" type="button"></button>
</dialog>

<script>
"use strict";

const kitchenImages = {};
if (typeof Image !== "undefined") {
  for (const [name, url] of Object.entries({room:window.kitchenBackground,...window.kitchenSprites})) {
    if (!url) continue;
    const img = new Image();
    img.onload=()=>{kitchenImages[name]=img;window.dispatchEvent(new Event("kitchen-art"));};
    img.src=url;
  }
}

function drawKitchen(ctx, state, time) {
  const { step, progress, frosting, fillings, toppings, cut, eggTaps, oven, strokes, candleX } = state;
  const hand=state.hand, effect=state.effect;
  const wave = Math.sin(time / 950);
  function fill(color, shape) {
    ctx.beginPath();
    shape();
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, color, rotation = 0) {
    fill(color, () => ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2));
  }
  function rect(x,y,w,h,r,color) {
    fill(color, () => ctx.roundRect(x,y,w,h,r));
  }
  function poly(color, ...points) {
    fill(color, () => { ctx.moveTo(...points[0]); points.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); });
  }
  function curve(color, width, shape) {
    ctx.beginPath(); shape(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap="round"; ctx.stroke();
  }
  function sprite(name,x,y,width,angle=0,anchorX=.5,anchorY=.5) {
    const image=kitchenImages[name];
    if(!image)return false;
    const height=width*image.naturalHeight/image.naturalWidth;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    ctx.drawImage(image,-width*anchorX,-height*anchorY,width,height);
    ctx.restore();return true;
  }
  function gradient(x1,y1,x2,y2,colors){
    const light=ctx.createLinearGradient(x1,y1,x2,y2);
    colors.forEach((color,i)=>light.addColorStop(i/(colors.length-1),color));return light;
  }
  function ingredient(name, x, y, scale = 1) {
    ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
    if (name === "草莓") {
      if(sprite("strawberry",0,0,40)) {ctx.restore();return;}
      fill("#ba3d60",()=>{ctx.moveTo(0,15);ctx.bezierCurveTo(-28,-4,-20,-22,0,-13);ctx.bezierCurveTo(20,-22,28,-4,0,15);});
      poly("#657e65",[-12,-15],[-3,-17],[0,-24],[5,-17],[13,-15],[0,-11]);
      for (const [a,b] of [[-9,-6],[1,-7],[9,-3],[-4,1],[4,5]]) ellipse(a,b,1.4,2,"#f6d7ab",-.35);
    } else if (name === "蓝莓") {
      ellipse(-7,4,11,10,"#52679a");ellipse(7,-2,11,10,"#6b7fb0");ellipse(4,-5,4,2,"#a0acd1");
    } else if (name === "芒果" || name === "蜜桃") {

const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const tray=()=>[...data.selected,...extras];
function updateMeter(){
  const meter=$("gesture-meter");
  meter.hidden=!gestures.has(data.step)&&data.step!=="bake";
  const value=data.step==="bake"?clamp((performance.now()-stageTime)/3600,0,1):data.progress;
  const fill=meter.querySelector("span");
  fill.style.transform="scaleX("+value+")";
  meter.setAttribute("aria-valuenow",String(Math.round(value*100)));
}
function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch{}}
function tone(freq=480) {
  if(!data.sound) return;
  try {
    const Audio=window.AudioContext||window.webkitAudioContext;
    audio ??= new Audio();
    void audio.resume();
    const oscillator=audio.createOscillator(), gain=audio.createGain();
    oscillator.frequency.value=freq; oscillator.type="sine";
    gain.gain.setValueAtTime(.07,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.19);
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start(); oscillator.stop(audio.currentTime+.2);
  } catch {}
}
function render(now) {
  drawRequested=false;
  const oven=["fruit","bake","ovenOut"].includes(data.step);
  const progress=data.step==="bake"&&!data.pending ? Math.min(1,(now-stageTime)/(reduce.matches?90:3600)) : oven && data.step!=="fruit" ? 1 : data.progress;
  if(effect)effect.amount=clamp((now-effect.start)/effect.duration,0,1);
  drawKitchen(ctx,{...data,oven,progress,breath,hand:active?.hand,effect,tray:tray()},reduce.matches?0:now);
  if(data.step==="bake")updateMeter();
  if(data.step==="bake" && !data.pending && progress>=1) bless("bake","ovenOut");
  if(data.step==="bake"||!reduce.matches&&(effect||data.step==="blow")) redraw();
}
function redraw(){if(!drawRequested){drawRequested=true;frame=requestAnimationFrame(render);}}
function move(step) {
  if(micStop) micStop();
  const before=data.step;
  data.step=step;data.progress=0;stageTime=performance.now();choiceNotice="";
  if(before==="intro"){
    const board=$("board");board.classList.remove("transition");
    void board.offsetWidth;board.classList.add("transition");
  }
  save();refresh();
}
function button(parent,text,handler,{style="choice",pressed,disabled=false}={}) {
  const el=document.createElement("button");
  el.type="button";el.className=style;el.textContent=text;el.disabled=disabled;
  if(pressed!==undefined) el.setAttribute("aria-pressed",String(pressed));
  el.addEventListener("click",handler);parent.append(el);return el;
}
function refresh() {
  const step=data.step;
  $("intro").hidden=step!=="intro"; $("work").hidden=step==="intro";
  $("envelope").hidden=step!=="done";
  $("ticket").hidden=!(data.toppings.some(p=>p.name==="爆米花"&&data.toppings.some(q=>q.name==="巧克力碎"&&Math.hypot(p.x-q.x,p.y-q.y)<55)));
  $("board").classList.toggle("candle",["insert","light","blow"].includes(step));
  $("board").classList.toggle("game",step!=="intro"&&step!=="done");
  $("station-status").hidden=step==="intro"||step==="done";
  $("count").textContent=data.collected.length;
  $("sound").textContent=data.sound?"声音开":"声音关";
  $("sound").setAttribute("aria-pressed",String(data.sound));
  const stage=stages[step];
  document.querySelectorAll(".steps span").forEach((el,i)=>{
    el.classList.toggle("active",i===stage?.[2]);el.classList.toggle("done",i<(stage?.[2]??0));
    if(i===stage?.[2]) el.setAttribute("aria-current","step");else el.removeAttribute("aria-current");
  });
  $("choices").replaceChildren();$("actions").replaceChildren();redraw();
  if(!stage) return;
  $("station-name").textContent=stage[0];
  updateMeter();
  $("step-title").textContent=stage[0];
  $("hint").textContent=choiceNotice || (step==="egg"&&data.eggTaps?"从裂缝往外拖，把蛋壳掰开。":stage[1]);
  if(data.pending || effect) return;
  const c=$("choices"), a=$("actions");
  const main=(label,fn,disabled=false)=>button(a,label,fn,{style:"primary",disabled});
  const alt=(label,fn)=>button(a,label,fn,{style:"secondary"});
  if(step==="egg") main(data.eggTaps?"掰开蛋壳":"敲一下",()=>{
    if(!data.eggTaps){data.eggTaps=1;tone(320);save();refresh();return;}
    crackEgg();
  });
  if(step==="sugar") main("倒糖",()=>progressAction(.5,"mix"));
  if(step==="mix") main("转动打蛋器",()=>progressAction(.25,null,"mix","sift"));
  if(step==="sift") main("摇筛子",()=>progressAction(.34,"fold"));
  if(step==="fold") main("翻拌一下",()=>progressAction(.34,"pan"));
  if(step==="pan") main("倒入模具",()=>move("tap"));
  if(step==="tap") main("轻敲模具",()=>progressAction(.5,"fruit"));
  if(step==="fruit") {
    for(const item of fruit) button(c,item,()=>{
      if(data.selected.includes(item)){data.selected=data.selected.filter(x=>x!==item);data.prepared=data.prepared.filter(x=>x!==item);}
      else if(data.selected.length<2) data.selected.push(item);
      else choiceNotice="可以选两种水果，先点掉一种再换。";
      save();refresh();
    },{pressed:data.selected.includes(item)});
    const prep=data.selected.find(item=>!data.prepared.includes(item));
    if(prep) main(prep==="蓝莓"?"洗蓝莓":"切"+prep,prepareFruit);

  }
  if(step==="bake") $("hint").textContent="看，蛋糕正在鼓起来。";
  if(step==="ovenOut") main("戴手套取出",()=>{tone(690);move("cutLayer");});
  if(step==="cutLayer") main("脱模并切层",()=>move("cream"));
  if(step==="cream") main("抹夹心奶油",()=>progressAction(.5,"filling"));
  if(step==="filling") {
    for(const item of [...data.selected,...extras]) button(c,item,()=>putFilling(item),{pressed:data.fillings.includes(item)});
    main("夹心铺好了",()=>move("cap"),!data.fillings.some(x=>fruit.includes(x)));
  }
  if(step==="cap") main("盖上蛋糕",()=>move("frost"));
  if(step==="frost") {
    for(const [name,color] of Object.entries(palette)) button(c,name,()=>{data.frosting=color;save();refresh();},{pressed:color===data.frosting});
    main("抹一圈奶油",()=>progressAction(.5,"decorate"));
  }
  if(step==="decorate") {
    for(const item of ["草莓","蓝莓","巧克力碎","爆米花","糖霜","生日牌"]) button(c,item,()=>{tool=item;refresh();},{pressed:tool===item});
    main("装饰好了",()=>move("insert"));
    alt("放上"+tool,()=>addTopping(360+Math.cos(data.toppings.length*1.9)*74,326+Math.sin(data.toppings.length*1.9)*30));
    if(data.toppings.length||data.strokes.length) alt("撤销",()=>{
      if(data.strokes.length) data.strokes.pop();else data.toppings.pop();save();refresh();
    });
  }
  if(step==="insert") main("插上蜡烛",()=>placeCandle(360));
  if(step==="light") main("点蜡烛",()=>{tone(490);move("blow");});
  if(step==="blow") {
    const hold=main("长按吹灭",()=>{});
    hold.classList.add("hold");
    hold.addEventListener("pointerdown",e=>{hold.setPointerCapture(e.pointerId);startBlow();});
    hold.addEventListener("pointerup",stopBlowHold);
    hold.addEventListener("pointercancel",stopBlowHold);
    hold.addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="Enter")&&!e.repeat){e.preventDefault();startBlow();}});
    hold.addEventListener("keyup",stopBlowHold);
    // Synthesized clicks from assistive technology can activate the same action.
    hold.addEventListener("click",e=>{if(e.detail===0&&breath===0&&!micStop) startBlow();});
    alt("用麦克风吹",listenForBlow);
  }
  if(step==="cut") main(data.cut.length?"切第二刀":"切第一刀",()=>makeCut(data.cut.length?452:487,data.cut.length?365:309));
  if(step==="done") {
    main("保存蛋糕照片",downloadCake);
    alt("再做一个",()=>show("再做一个？","重新开始后，这一次的蛋糕和福袋会清空。","重新开始",()=>{data=fresh();save();refresh();}));
  }
}
function progressAction(amount,next,wishKey,wishNext) {
  data.progress=Math.min(1,data.progress+amount);tone(330+data.progress*140);
  if(data.progress>=1){if(wishKey) bless(wishKey,wishNext);else move(next);}
  else {save();updateMeter();redraw();}
}
function playEffect(kind,duration,done){
  if(reduce.matches){done();return;}
  effect={kind,duration,start:performance.now(),amount:0};refresh();
  setTimeout(()=>{effect=null;done();},duration);
}
function crackEgg(){tone(510);playEffect("egg",630,()=>bless("egg","sugar"));}
function prepareFruit(){
  const item=data.selected.find(name=>!data.prepared.includes(name));
  if(!item)return;
  data.fruitPrep+=1;tone(400);
  if(data.fruitPrep>=2){data.prepared.push(item);data.fruitPrep=0;choiceNotice=item+"准备好了。";}
  else choiceNotice="再处理一下"+item+"。";
  save();refresh();
}
function putFilling(item) {
  if(data.fillings.includes(item)) { openWish(item); return; }
  if(extras.includes(item)&&data.fillings.filter(x=>extras.includes(x)).length>=2){
    choiceNotice="额外夹心可以放两样。";refresh();return;
  }
  data.fillings.push(item);tone(450);bless(item,"filling");
}
function show(title,content,label="合上",action=null,kind="") {
  if(paper.open) return;
  $("paper-title").textContent=title;
  const body=$("paper-body");body.replaceChildren();
  if(typeof content==="string"){
    const p=document.createElement("p");p.className=kind;p.textContent=content;body.append(p);
  } else body.append(content);
  $("paper-button").textContent=label;modalAction=action;
  paper.showModal();
}
function bless(id,next) {
  if(data.collected.includes(id)){move(next);return;}
  data.pending={id,next};save();refresh();openWish(id,true);
}
function openWish(id,pending=false) {
  show(wishes[id][0],wishes[id][1],pending?"放进福袋":"合上",pending?()=>{
    const next=data.pending.next; data.collected.push(id);data.pending=null;
    move(next);tone(620);
    $("bag").classList.remove("pop");void $("bag").offsetWidth;$("bag").classList.add("pop");
  }:null,"wish");
}
$("paper-button").addEventListener("click",()=>{
  if($("paper-button").disabled)return;
  const action=modalAction;
  const close=()=>{paper.close();paper.classList.remove("folding");$("paper-button").disabled=false;modalAction=null;if(action)action();};
  if(data.pending&&!reduce.matches&&typeof paper.animate==="function"){
    const source=paper.getBoundingClientRect();
    const target=$("bag").getBoundingClientRect();
    close();
    const flyer=document.createElement("span");
    flyer.className="wish-travel";flyer.textContent="✦";
    flyer.setAttribute("aria-hidden","true");
    const x=source.left+source.width/2-28,y=source.top+source.height/2-19;
    flyer.style.left=x+"px";flyer.style.top=y+"px";
    document.body.append(flyer);
    flyer.animate([{transform:"scale(1.12) rotate(-9deg)",opacity:1},
      {transform:"translate("+ (target.left+target.width/2-28-x) +"px,"+ (target.top+target.height/2-19-y) +"px) scale(.32) rotate(19deg)",opacity:.45}],
      {duration:490,easing:"cubic-bezier(.38,.04,.24,1)"}).finished.then(()=>flyer.remove(),()=>flyer.remove());
  } else close();
});
paper.addEventListener("cancel",e=>{if(data.pending)e.preventDefault();});
$("start").addEventListener("click",()=>move("egg"));
$("sound").addEventListener("click",()=>{data.sound=!data.sound;save();refresh();tone();});
$("ticket").addEventListener("click",()=>show("电影票","本场选片人：玲子"));

  if(!data.collected.length){show("玲子的福袋","福袋还是空的。");return;}

function addTopping(x,y) {
  if(data.toppings.length>=36){choiceNotice="蛋糕顶已经摆满了。";refresh();return;}
  const px=Math.max(-113,Math.min(113,(x-360)/1.11)), py=Math.max(-34,Math.min(34,(y-326)/1.11));
  data.toppings.push({name:tool,x:px,y:py});tone(470);save();refresh();
}
function placeCandle(x){data.candleX=Math.max(276,Math.min(445,x));data.placed=true;move("light");}
function makeCut(x,y) {
  data.cut.push([x,y]);tone(270);
  if(data.cut.length>=2) {
    move("done");
    if(!reduce.matches)playEffect("serve",820,refresh);
  }else {save();refresh();}
}
function downloadCake(){
  const photo=document.createElement("canvas");photo.width=720;photo.height=710;
  const pc=photo.getContext("2d");pc.fillStyle="#dce7f1";pc.fillRect(0,0,720,710);
  pc.fillStyle="#29394d";pc.font='bold 39px "SimSun", serif';pc.textAlign="center";pc.fillText("dear玲子，20岁生日快乐",360,80);
  pc.translate(0,115);drawKitchen(pc,{...data,oven:false,breath:0},0);
  const link=document.createElement("a");link.href=photo.toDataURL("image/png");link.download="玲子的生日蛋糕.png";link.click();

function startBlow(){
  if(data.step!=="blow" || pressTimer) return;
  if(micStop) micStop();
  breath=.85;redraw();
  pressTimer=setTimeout(()=>{pressTimer=null;extinguish();},720);
}
function stopBlowHold(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null;breath=0;redraw();}}
function extinguish(){
  if(data.step!=="blow")return;
  if(micStop)micStop();
  breath=0;tone(300);move("cut");
}
async function listenForBlow(){
  if(micStop || data.step!=="blow")return;
  const status=message=>{$("hint").textContent=message;};
  if(!navigator.mediaDevices?.getUserMedia){status("这里无法使用麦克风，可以长按吹灭。");return;}
  const micButton=[...$("actions").children].find(el=>el.textContent==="用麦克风吹");
  micButton.disabled=true;
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(data.step!=="blow"){stream.getTracks().forEach(track=>track.stop());return;}
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio){stream.getTracks().forEach(track=>track.stop());throw new Error("Audio unavailable");}
    const microphone=new Audio(), analyser=microphone.createAnalyser(), samples=new Float32Array(1024);
    analyser.fftSize=1024;microphone.createMediaStreamSource(stream).connect(analyser);
    let listener=0, hits=0;
    const timeout=setTimeout(()=>{if(micStop)micStop();status("可以再试一次，或长按吹灭。");},15000);
    micStop=()=>{cancelAnimationFrame(listener);clearTimeout(timeout);stream.getTracks().forEach(track=>track.stop());void microphone.close(); micStop=null;micButton.disabled=false;};
    await microphone.resume();
    if(!micStop || data.step!=="blow")return;
    status("对着麦克风轻轻吹一口气。");
    function check(){
      analyser.getFloatTimeDomainData(samples);
      const rms=Math.sqrt(samples.reduce((sum,x)=>sum+x*x,0)/samples.length);
      breath=Math.min(1,rms*10);hits=rms>.065?hits+1:0;redraw();
      if(hits>4) extinguish();else listener=requestAnimationFrame(check);
    }
    listener=requestAnimationFrame(check);
  } catch {if(micStop)micStop();micButton.disabled=false;status("麦克风没有打开，可以长按吹灭。");}
}
function position(e){const box=canvas.getBoundingClientRect();return [(e.clientX-box.left)*720/box.width,(e.clientY-box.top)*570/box.height];}
function insideBowl(x,y){return Math.hypot((x-360)/150,(y-344)/65)<=1.15;}
function insideCake(x,y){return Math.hypot((x-360)/154,(y-326)/58)<=1.1;}
const effort={sugar:155,mix:990,sift:405,fold:500,pan:172,cream:490,frost:500};
canvas.addEventListener("pointerdown",e=>{
  if(active||effect||data.pending||paper.open||["intro","done","bake","blow"].includes(data.step)) return;
  const [x,y]=position(e);
  const drag={x,y,distance:0,step:data.step,pointer:e.pointerId,original:[x,y],target:null,line:null,hand:null};
  if(data.step==="egg"){
    const sourceX=data.eggTaps?387:527,sourceY=data.eggTaps?286:301;
    if(Math.hypot(x-sourceX,y-sourceY)>100)return;
    drag.hand={kind:"egg",x,y};
  }
  if(data.step==="mix"){
    if(!insideBowl(x,y)&&!(x>370&&x<535&&y>150&&y<340))return;
    drag.hand={kind:"whisk",x,y,turn:Math.atan2((y-343)*2,x-360)};
  }
  if(["cream","frost","fold","pan","sugar","sift"].includes(data.step)){
    drag.hand={kind:"spatula",x,y};
    if(["pan","sugar","sift"].includes(data.step))drag.hand.kind=data.step;
  }
  if(["cut","cutLayer","fruit"].includes(data.step)){
    drag.hand={kind:"knife",x,y};
  }
  if(data.step==="filling"){
    const i=Math.round((x-150)/60);
    if(y<454||y>534||i<0||i>=tray().length)return;
    drag.hand={kind:"ingredient",item:tray()[i],x,y};
  }
  if(data.step==="decorate"&&y>278&&y<365&&x>208&&x<512){
    drag.target=data.toppings.findLast(item=>Math.hypot(item.x*1.11+360-x,item.y*1.11+326-y)<21);
    if(!drag.target&&tool==="糖霜"){drag.line=[[x/1.11-360/1.11,y/1.11-326/1.11]];data.strokes.push(drag.line);}
  }
  canvas.setPointerCapture(e.pointerId);
  active=drag;
  redraw();
});
canvas.addEventListener("pointermove",e=>{
  if(!active||e.pointerId!==active.pointer)return;
  const [x,y]=position(e), distance=Math.hypot(x-active.x,y-active.y);
  active.distance+=distance;active.x=x;active.y=y;
  if(active.hand){
    active.hand.x=x;active.hand.y=y;
    if(active.hand.kind==="whisk") active.hand.turn=Math.atan2((y-343)*2,x-360);
  }
  const step=data.step;
  if(effort[step]){
    const inRange=["mix","fold"].includes(step)?insideBowl(x,y):
      ["frost","cream"].includes(step)?insideCake(x,y):y>225&&y<465&&x>170&&x<590;
    if(inRange){
      data.progress=clamp(data.progress+Math.min(80,distance)/effort[step],0,1);
      if(step==="frost"||step==="cream"){
        active.hand.trail??=[];
        const last=active.hand.trail.at(-1);
        if((!last||Math.hypot(x-last[0],y-last[1])>9)&&active.hand.trail.length<70) active.hand.trail.push([x,y]);
      }
      updateMeter();
    }
  }
  if(active.target){active.target.x=Math.max(-113,Math.min(113,(x-360)/1.11));active.target.y=Math.max(-34,Math.min(34,(y-326)/1.11));}
  if(active.line&&x>221&&x<499&&y>284&&y<366)active.line.push([(x-360)/1.11,(y-326)/1.11]);
  redraw();
});
canvas.addEventListener("pointercancel",()=>{active=null;save();redraw();});
canvas.addEventListener("pointerup",e=>{
  if(!active||e.pointerId!==active.pointer)return;
  const drag=active;active=null;
  const [x,y]=position(e);if(drag.step!==data.step)return;
  const d=drag.distance;
  const finished={sugar:"mix",sift:"fold",fold:"pan",pan:"tap",cream:"filling",frost:"decorate"};
  if(effort[data.step]){
    const step=data.step;
    if(data.progress>=1){
      if(step==="mix")bless("mix","sift");else move(finished[step]);
    }else{save();updateMeter();redraw();}
    return;
  }
  switch(data.step){
    case "egg":
      if(data.eggTaps&&d>27)crackEgg();
      else if(!data.eggTaps&&x>200&&x<508&&y>263&&y<392){data.eggTaps=1;save();refresh();tone(320);}
      else redraw();
      break;
    case "tap":progressAction(.5,"fruit");break;
    case "fruit":if(d>23&&y>432)prepareFruit();else redraw();break;
    case "cutLayer":if(d>58&&y>265&&y<445)move("cream");else redraw();break;
    case "filling":if(drag.hand&&insideCake(x,y))putFilling(drag.hand.item);else redraw();break;
    case "cap":move("frost");break;
    case "decorate":
      if(drag.line&&drag.line.length<2){data.strokes.pop();addTopping(x,y);}
      else if(!drag.line&&!drag.target&&x>208&&x<512&&y>278&&y<365)addTopping(x,y);
      else {save();refresh();}
      break;
    case "insert":if(y>270&&y<377)placeCandle(x);break;
    case "light":if(Math.hypot(x-data.candleX,y-251)<78)move("blow");break;
    case "cut":{
      if(d<35){redraw();break;}
      const [sx,sy]=drag.original;
      const angle=Math.atan2((sy-326)/57,(sx-360)/153);
      if(data.cut.length){
        const [px,py]=data.cut[0];
        const first=Math.atan2((py-326)/57,(px-360)/153);
        if(Math.abs(Math.atan2(Math.sin(angle-first),Math.cos(angle-first)))<.25){
          choiceNotice="第二刀从旁边一点切，能取出完整一片。";refresh();break;
        }
      }
      makeCut(360+Math.cos(angle)*153,326+Math.sin(angle)*57);break;
    }
  }
});
window.addEventListener("pagehide",()=>{if(micStop)micStop();cancelAnimationFrame(frame);});
window.addEventListener("kitchen-art",redraw);

  if(document.hidden){stopBlowHold();if(micStop)micStop();}
  else {drawRequested=false;redraw();}
